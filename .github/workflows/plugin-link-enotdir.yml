name: plugin-link-enotdir-update

on:
  workflow_dispatch:
    inputs:
      cell:
        description: "red (published candidate, guards narrow -> must abort) | green (candidate built from the reviewed head, guards widened -> must complete)"
        required: true
        default: green
      pr_ref:
        description: PR branch in SunnyShu0925/openclaw
        required: true
        default: fix/plugin-tree-unresolved-link-enotdir-283
      published_driver:
        description: Published openclaw version installed as the driver in both cells
        required: false
        default: "2026.10.9"
      published_target:
        description: Published version used as the red cell candidate
        required: false
        default: "2026.10.10-beta.5"
      candidate_version:
        description: Version stamped on the package built from the reviewed head
        required: false
        default: "2026.10.10-headfix.1"
      reuse_run_id:
        description: "optional: reuse the packaged head build from this earlier run"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CELL: ${{ inputs.cell }}
      PUBLISHED_DRIVER: ${{ inputs.published_driver }}
      PUBLISHED_TARGET: ${{ inputs.published_target }}
      CANDIDATE_VERSION: ${{ inputs.candidate_version }}
      PORT_GATEWAY: "19031"
      HEADFIX_TGZ: ${{ github.workspace }}/artifacts/candidate/openclaw-headfix.tgz
    steps:
      - name: Checkout proof harness
        uses: actions/checkout@v4

      - name: Reuse the packaged head build from an earlier run
        if: inputs.cell == 'green' && inputs.reuse_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: head-build
          path: artifacts/pkg
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout reviewed PR head
        if: inputs.cell == 'green' && inputs.reuse_run_id == ''
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: ${{ inputs.pr_ref }}
          path: openclaw

      - name: Report head identity
        if: inputs.cell == 'green' && inputs.reuse_run_id == ''
        working-directory: openclaw
        run: |
          git rev-parse HEAD
          git log -1 --format='%H %s'

      - name: Setup Node 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Build and package the reviewed head
        if: inputs.cell == 'green' && inputs.reuse_run_id == ''
        working-directory: openclaw
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
          # package profile keeps the canonical dts that --skip-build integrity needs.
          pnpm build:package
          node scripts/package-openclaw-for-docker.mjs --skip-build --allow-unreleased-changelog \
            --output-dir "$GITHUB_WORKSPACE/artifacts/pkg" --output-name openclaw-head.tgz
          ls -l "$GITHUB_WORKSPACE/artifacts/pkg"

      - name: Keep the packaged head for the other run
        if: inputs.cell == 'green' && always() && inputs.reuse_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: head-build
          path: artifacts/pkg
          if-no-files-found: warn

      # The candidate must be a distinct version so the shipped updater treats it as an
      # upgrade; the bytes still come from the reviewed head commit.
      - name: Stamp the reviewed build as the green candidate
        if: inputs.cell == 'green'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/candidate"
          work=$(mktemp -d)
          tar xzf "$GITHUB_WORKSPACE/artifacts/pkg/openclaw-head.tgz" -C "$work"
          node -e '
          const fs = require("node:fs");
          const file = process.argv[1];
          const doc = JSON.parse(fs.readFileSync(file, "utf8"));
          console.log("head_package_version=", doc.version);
          doc.version = process.argv[2];
          fs.writeFileSync(file, JSON.stringify(doc, null, 2));
          ' "$work/package/package.json" "$CANDIDATE_VERSION"
          tar czf "$HEADFIX_TGZ" -C "$work" package
          ls -lh "$HEADFIX_TGZ"

      - name: Install the published driver for this cell
        run: |
          set -euo pipefail
          NPM_PREFIX=$(npm prefix -g)
          # --ignore-scripts only skips the release's interactive shell-completion hook;
          # it changes no runtime file, so the command stays the published one.
          npm install -g "openclaw@$PUBLISHED_DRIVER" --no-audit --no-fund --ignore-scripts
          echo "driver_source=published npm release"
          echo "DRIVER_BIN=$NPM_PREFIX/bin/openclaw" >> "$GITHUB_ENV"
          echo "DRIVER_PKG=$NPM_PREFIX/lib/node_modules/openclaw" >> "$GITHUB_ENV"
          "$NPM_PREFIX/bin/openclaw" --version

      - name: Run the shipped-update proof
        run: |
          set -euo pipefail
          bash scripts/plugin-link-enotdir.sh "$CELL"

      - name: Print the update trace
        if: always()
        run: |
          set +e
          echo "=== proof summary ==="
          cat /tmp/proof-summary.txt
          echo
          echo "=== update json, full ==="
          cat /tmp/update.json
          echo
          echo "=== update stderr, full ==="
          cat /tmp/update.err
          echo
          echo "=== update report written by the shipped updater ==="
          for f in "$HOME"/.openclaw/update-reports/*.md; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            head -40 "$f"
          done
          echo
          echo "=== phase markers ==="
          grep -hoE "Phase: [a-z ]+|candidate-state-snapshot[^\"]*|OpenClaw updated to [^\"]*|Admission checks: [^\"]*" \
            /tmp/update.json /tmp/update.err 2>/dev/null | sort -u | head -20
          echo
          echo "=== proof plugin tree after the update ==="
          find "$HOME/.openclaw/extensions/proof-plugin" -maxdepth 2 | sort
          echo "link=$(readlink "$HOME/.openclaw/extensions/proof-plugin/plugin-link")"

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-link-enotdir-cell
          path: |
            /tmp/proof-summary.txt
            /tmp/update.json
            /tmp/update.err
            /home/runner/.openclaw/update-reports
          if-no-files-found: warn
